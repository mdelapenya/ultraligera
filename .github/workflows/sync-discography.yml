name: Sync discography

on:
  schedule:
    # Nightly at 04:00 UTC — after tour (03:00) and YouTube (03:30) sync.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-discography
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Refresh data/discography.json from iTunes
        run: npm run sync:disco

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(music): sync discography from iTunes"
          file_pattern: data/discography.json
          commit_user_name: ultraligera-bot
          commit_user_email: bot@users.noreply.github.com
