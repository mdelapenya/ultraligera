name: Sync tour dates

on:
  schedule:
    # Nightly at 03:00 UTC (~04:00 CET / 05:00 CEST).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-tour
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Scrape & update data/gigs.json
        run: npm run sync:tour

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(tour): sync from ultraligera.com"
          file_pattern: data/gigs.json
          commit_user_name: ultraligera-bot
          commit_user_email: bot@users.noreply.github.com
